<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Save closed window?</title>
    <link rel="stylesheet" href="close-prompt.css" />
  </head>
  <body>
    <main>
      <h1>Save this window?</h1>
      <p id="summary">A browser window was just closed.</p>
      <div class="actions">
        <button id="skipBtn" type="button" class="secondary-btn">Don’t save</button>
        <button id="saveBtn" type="button" class="primary-btn">Save session</button>
      </div>
      <p id="status" class="status"></p>
    </main>
    <script type="module" src="close-prompt.js"></script>
  </body>
</html>
