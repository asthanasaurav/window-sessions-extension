<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add tab to session</title>
    <link rel="stylesheet" href="add-tab-to-session.css" />
  </head>
  <body>
    <h1>Add tab to session</h1>
    <p id="subtitle" class="subtitle">Loading tab…</p>

    <label class="field">
      <span>Search sessions</span>
      <input id="searchInput" type="search" placeholder="Search sessions…" autocomplete="off" />
    </label>

    <div id="sessionList" class="session-list" role="listbox" aria-label="Saved sessions"></div>

    <label class="checkbox-row">
      <input id="closeTabInput" type="checkbox" />
      <span>Close tab after adding (move)</span>
    </label>

    <div class="actions">
      <button type="button" id="cancelBtn" class="secondary-btn">Cancel</button>
      <button type="button" id="addBtn" class="primary-btn" disabled>Add to session</button>
    </div>

    <p id="status" class="status"></p>
    <script type="module" src="add-tab-to-session.js"></script>
  </body>
</html>
