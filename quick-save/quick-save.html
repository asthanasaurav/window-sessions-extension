<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quick Save</title>
    <link rel="stylesheet" href="quick-save.css" />
  </head>
  <body>
    <h1>Quick save</h1>
    <p id="subtitle" class="subtitle">Saving current window…</p>

    <form id="quickSaveForm">
      <label class="field">
        <span>Session name</span>
        <input id="nameInput" type="text" required maxlength="120" placeholder="Name this window…" autofocus />
      </label>

        <label class="checkbox-row">
          <input id="updateExistingInput" type="checkbox" />
          <span>Update existing session if name matches</span>
        </label>

      <div class="actions">
        <button type="button" id="cancelBtn" class="secondary-btn">Cancel</button>
        <button type="submit" class="primary-btn">Save</button>
      </div>
    </form>

    <p id="status" class="status"></p>
    <script type="module" src="quick-save.js"></script>
  </body>
</html>
